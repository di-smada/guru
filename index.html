<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta name="theme-color" content="#0369A1">
  <title>DI-SMADA</title>

  <!-- Jika Anda sudah punya manifest.json & service worker untuk fitur "Install Aplikasi",
       biarkan baris ini tetap ada (sesuaikan path-nya jika berbeda). -->
  <link rel="manifest" href="./manifest.json">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(135deg, #075985 0%, #0369A1 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
      padding: 24px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 8px; }
    p { font-size: 0.85rem; color: rgba(255,255,255,0.85); margin: 0 0 20px; max-width: 320px; }
    a.manual-link {
      color: white;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.4);
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }
    a.manual-link:hover { background: rgba(255,255,255,0.25); }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>Memuat Aplikasi...</h1>
  <p>Anda akan dialihkan otomatis ke aplikasi DI SMADA. Jika tidak berpindah dalam beberapa detik, tekan tombol di bawah.</p>
  <a class="manual-link" id="manual-link" href="#">Buka Aplikasi Sekarang</a>

  <script>
    // GANTI URL INI jika suatu saat link deployment Apps Script Anda berubah.
    const APP_URL = "https://script.google.com/macros/s/AKfycbzvGSo0ZjpvnqmsoFJx6tbcgDvugOoxPT5fL0MCYtDfGrdq0bBulCdNVfED9_2EW5WK/exec";

    document.getElementById('manual-link').href = APP_URL;

    // [PERBAIKAN UTAMA] Redirect langsung (top-level navigation), BUKAN iframe.
    // Ini menghindari masalah Google memblokir halaman login/consent-nya sendiri
    // saat dimuat di dalam iframe -- terutama saat dijalankan sebagai PWA/APK terinstall.
    window.location.replace(APP_URL);
  </script>
</body>
</html>
